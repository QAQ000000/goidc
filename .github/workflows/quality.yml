name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-quality:
    name: Static quality and contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHANGE_BASE_CANDIDATE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve shared documentation and architecture comparison base
        shell: bash
        run: |
          change_base="$CHANGE_BASE_CANDIDATE"
          if [[ "$change_base" == 0000000000000000000000000000000000000000 ]]; then
            # A newly created branch has no previous tip; use a root ancestor
            # instead of silently checking only HEAD^.
            change_base="$(git rev-list --max-parents=0 "$GITHUB_SHA" | LC_ALL=C sort | head -n 1)"
          fi
          [[ "$change_base" =~ ^[0-9a-fA-F]{40}$ ]]
          git cat-file -e "${change_base}^{commit}"
          printf 'DOC_BASE=%s\nGOIDC_ARCH_BASE_REF=%s\n' "$change_base" "$change_base" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check changed files
        run: git diff --check "$DOC_BASE...$GITHUB_SHA"

      - name: Check documentation governance and links
        run: |
          node scripts/check-doc-governance.mjs --diff-base "$DOC_BASE"
          node scripts/check-doc-links.mjs

      - name: Check contract gate manifest
        run: node scripts/check-contract-gates.mjs

      - name: Run governance tool tests
        run: node --test scripts/check-doc-governance.test.mjs scripts/check-doc-links.test.mjs scripts/check-contract-gates.test.mjs

      - name: Check Go toolchain and compile tests
        run: |
          ./scripts/check-go-toolchain.sh
          ./scripts/go.sh test ./... -run '^$'

      - name: Enforce architecture boundaries and shrinking persistence baseline
        run: ./scripts/go.sh test ./internal/archtest -count=1

      - name: Check JSON-only report responses
        run: ./scripts/go.sh test -race ./internal/httpapi -run '^TestWriteReportJSONOnlyFormats$'

      - name: Install binary introspection tracer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends strace

      - name: Check compiled module contracts
        run: |
          node --test scripts/module-manifest.test.mjs scripts/compiled-notification-gates.test.mjs scripts/release-runtime-acceptance.test.mjs
          node scripts/test-compiled-notifications.mjs --unit
          node scripts/test-compiled-certification.mjs --unit
          node scripts/test-compiled-payments.mjs --unit
          node scripts/test-compiled-suppliers.mjs --unit
          node scripts/test-file-storage.mjs --unit
          node scripts/test-scheduler.mjs --unit
          node scripts/test-runtime-observability.mjs --unit
          node scripts/test-captcha.mjs --unit

      - name: Check actual API and worker module manifests without runtime configuration
        run: node scripts/check-module-binaries.mjs

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Check web
        run: |
          npm --prefix web run lint
          npm --prefix web run typecheck
          npm --prefix web run test:proxy
          node --test scripts/channel-components.test.mjs scripts/notification-center-components.test.mjs scripts/web-push-components.test.mjs scripts/web-push-proxy.test.mjs
          node --test scripts/download.test.mjs
          node --test scripts/site-theme.test.mjs
          node --test scripts/certification-components.test.mjs
          node --test scripts/payment-reconciliation-components.test.mjs
          node --test scripts/supplier-components.test.mjs
          node --test scripts/scheduler-components.test.mjs
          node --test scripts/runtime-observability-components.test.mjs
          node --test scripts/captcha-components.test.mjs

  compiled-notification-pg18:
    name: Compiled channels and notifications on isolated PG18
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Disposable CI-only credentials. No repository or production secrets.
      ZJMFGO_TEST_DATABASE_URL: postgres://goidc_ci:goidc_ci_fixture@127.0.0.1:15432/goidc_ci_test?sslmode=disable
      REQUIRE_INTEGRATION: '1'
      ZJMFGO_WORKER_CRASH_ACCEPTANCE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Build actual upgrade-check API and worker binaries
        timeout-minutes: 10
        run: |
          ci_upgrade_bin_dir="$(mktemp -d "$RUNNER_TEMP/goidc-upgrade-binaries.XXXXXXXX")"
          printf 'GOIDC_CI_UPGRADE_BIN_DIR=%s\n' "$ci_upgrade_bin_dir" >> "$GITHUB_ENV"
          ./scripts/go.sh build -mod=readonly -trimpath -buildvcs=true -o "$ci_upgrade_bin_dir/api" ./cmd/api
          ./scripts/go.sh build -mod=readonly -trimpath -buildvcs=true -o "$ci_upgrade_bin_dir/worker" ./cmd/worker

      - name: Start dedicated PostgreSQL 18 on host loopback
        timeout-minutes: 5
        run: |
          ci_pg_container="goidc-pg18-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          # Host networking preserves server-side inet_server_addr()=127.0.0.1;
          # a bridge-mapped services container violates the fixture boundary.
          docker run --detach --rm --name "$ci_pg_container" --network host \
            --env POSTGRES_USER=goidc_ci \
            --env POSTGRES_PASSWORD=goidc_ci_fixture \
            --env POSTGRES_DB=goidc_ci_test \
            postgres:18 postgres -c listen_addresses=127.0.0.1 -c port=15432 -c max_locks_per_transaction=1024
          for attempt in $(seq 1 60); do
            if docker exec "$ci_pg_container" pg_isready -h 127.0.0.1 -p 15432 -U goidc_ci -d goidc_ci_test; then
              docker exec --env PGPASSWORD=goidc_ci_fixture "$ci_pg_container" psql -X -h 127.0.0.1 -p 15432 -U goidc_ci -d goidc_ci_test \
                -c "SELECT current_database(),current_setting('server_version_num'),host(inet_server_addr());"
              exit 0
            fi
            sleep 1
          done
          docker logs --tail 40 "$ci_pg_container"
          exit 1

      - name: Require channel, notification, upgrade and process recovery tests
        env:
          ZJMFGO_UPGRADE_API_BINARY: ${{ env.GOIDC_CI_UPGRADE_BIN_DIR }}/api
          ZJMFGO_UPGRADE_WORKER_BINARY: ${{ env.GOIDC_CI_UPGRADE_BIN_DIR }}/worker
          ZJMFGO_UPGRADE_BINARY_ACCEPTANCE: '1'
        run: |
          ./scripts/check-go-toolchain.sh
          node scripts/test-compiled-notifications.mjs --integration

      - name: Check public theme and administration boundaries on PostgreSQL 18
        run: |
          ./scripts/go.sh test -race -count=1 -p=1 -parallel=1 ./internal/httpapi -run '^(TestSiteContentVersionedCRUDAndPermissions|TestSiteThemeValidationPermissionsAndReplay|TestSiteSettingsPermissionsValidationAndPublicProfile|TestSiteAdminSettingsAreVersionedAndNotPublic|TestMaintenanceCustomerGateAndAdminRecovery|TestMaintenanceSettingsValidation|TestMaintenancePaymentWebhookAndMFALogin|TestMaintenanceMissingSettingsFailsClosedAndPreservesRecovery)$'

      - name: Check report JSON boundaries and retained business file downloads
        run: ./scripts/go.sh test -race -count=1 -p=1 -parallel=1 ./internal/httpapi -run '^(TestReportEndpointsJSONOnlyFormatsAndPermissions|TestAnnualCashSeparatesReceiptsConsumptionAndRefundMonth|TestProductIncomeGroupsQuantitiesFiltersPaginationAndScope|TestSalesReportDetailsAmountsScopeAndSnapshot|TestTicketHandlerReportPeriodAssignmentStarsScopeAndPagination|TestDownloadsLifecycleBytesCategoriesAndSources|TestTicketAttachmentsAreOwnedAndBounded|TestNOKVMMonitoringHTTPPermissionsAndRedaction|TestCustomerFilesLifecycleOwnershipAndByteIntegrity|TestInvoiceElectronicFileAndAdjustmentControls|TestContractLifecycleSecurityAndSnapshots)$'

      - name: Require CAPTCHA provider and authentication boundaries on PostgreSQL 18
        run: node scripts/test-captcha.mjs --integration

      - name: Require certification providers, recovery and eligibility on PostgreSQL 18
        run: node scripts/test-compiled-certification.mjs --integration

      - name: Require cancellation, renewal and historical payment safety on PostgreSQL 18
        run: node scripts/test-service-cancellations.mjs --integration

      - name: Require payment runtime and historical financial compatibility on PostgreSQL 18
        run: node scripts/test-compiled-payments.mjs --integration

      - name: Require supplier configuration, delivery and recovery on PostgreSQL 18
        run: node scripts/test-compiled-suppliers.mjs --integration

      - name: Require file storage compatibility, authorization and recovery on PostgreSQL 18
        run: node scripts/test-file-storage.mjs --integration

      - name: Require internal scheduler catalog, audit and business compatibility on PostgreSQL 18
        run: node scripts/test-scheduler.mjs --integration

      - name: Require request correlation and worker diagnostics on PostgreSQL 18
        run: node scripts/test-runtime-observability.mjs --integration

      - name: Remove the dedicated PostgreSQL container and its volumes
        if: always()
        run: |
          ci_pg_container="goidc-pg18-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          if docker container inspect "$ci_pg_container" >/dev/null 2>&1; then
            docker rm --force --volumes "$ci_pg_container"
          fi

      - name: Remove only this job's upgrade-check binaries
        if: always()
        run: |
          if [[ -n "${GOIDC_CI_UPGRADE_BIN_DIR:-}" ]]; then
            case "$GOIDC_CI_UPGRADE_BIN_DIR" in
              "$RUNNER_TEMP"/goidc-upgrade-binaries.*)
                [[ -d "$GOIDC_CI_UPGRADE_BIN_DIR" && ! -L "$GOIDC_CI_UPGRADE_BIN_DIR" ]]
                rm -rf -- "$GOIDC_CI_UPGRADE_BIN_DIR"
                ;;
              *) exit 1 ;;
            esac
          fi
